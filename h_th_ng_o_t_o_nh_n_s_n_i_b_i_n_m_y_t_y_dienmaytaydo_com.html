<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ thống Đào tạo Nhân sự Nội bộ - Điện Máy Tây Đô (Dienmaytaydo.com)</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

  <!-- Top Header -->
  <header class="bg-gradient-to-r from-emerald-800 via-emerald-700 to-teal-700 text-white shadow-md sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-white/15 backdrop-blur flex items-center justify-center font-extrabold text-lg border border-white/25 shadow-inner">
          TĐ
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 class="font-bold text-base sm:text-lg tracking-tight">ĐIỆN MÁY TÂY ĐÔ ACADEMY</h1>
            <span class="hidden sm:inline-block text-xs bg-amber-400 text-slate-900 font-bold px-2 py-0.5 rounded-full">Kangaroo Cần Thơ & Miền Tây</span>
          </div>
          <p class="text-xs text-emerald-100">Hệ thống Đào tạo & Sát hạch Nhân sự Nội bộ • Dienmaytaydo.com</p>
        </div>
      </div>

      <!-- Employee Profile & Role Selector -->
      <div class="flex items-center gap-3 flex-wrap">
        <div class="flex items-center gap-2 bg-white/10 px-3 py-1.5 rounded-lg border border-white/15 text-xs">
          <span class="text-emerald-200">Vị trí:</span>
          <select id="roleSelect" class="bg-transparent font-semibold text-white focus:outline-none cursor-pointer">
            <option value="all" class="text-slate-800">Tất cả vị trí (Toàn diện)</option>
            <option value="sale" class="text-slate-800">Tư vấn Bán hàng (Sale Showroom & Online)</option>
            <option value="tech" class="text-slate-800">Kỹ thuật Lắp đặt & Bảo hành</option>
            <option value="cskh" class="text-slate-800">CSKH, Trực Hotline & Zalo OA</option>
          </select>
        </div>
        <button id="openProfileModalBtn" class="bg-white text-emerald-800 hover:bg-emerald-50 font-semibold text-xs px-3 py-1.5 rounded-lg shadow-sm transition flex items-center gap-1.5" title="Bấm vào để đổi tên nhân viên">
          <span id="headerStaffName">NV: Đang tải...</span>
          <span class="bg-emerald-100 text-emerald-800 px-1.5 py-0.5 rounded font-bold" id="headerProgressBadge">0%</span>
        </button>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="bg-emerald-900/60 border-t border-white/10">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex overflow-x-auto custom-scrollbar gap-1 py-1.5" id="mainNavTabs">
        <button data-tab="dashboard" class="nav-tab-btn px-3.5 py-2 rounded-lg text-xs sm:text-sm font-semibold whitespace-nowrap transition bg-white text-emerald-900 shadow-sm">
          1. Tổng quan & Lộ trình
        </button>
        <button data-tab="modules" class="nav-tab-btn px-3.5 py-2 rounded-lg text-xs sm:text-sm font-semibold whitespace-nowrap transition text-emerald-100 hover:bg-white/10">
          2. Học phần Đào tạo (5 Chuyên đề)
        </button>
        <button data-tab="catalog" class="nav-tab-btn px-3.5 py-2 rounded-lg text-xs sm:text-sm font-semibold whitespace-nowrap transition text-emerald-100 hover:bg-white/10">
          3. Tra cứu Sản phẩm & Báo giá
        </button>
        <button data-tab="scenarios" class="nav-tab-btn px-3.5 py-2 rounded-lg text-xs sm:text-sm font-semibold whitespace-nowrap transition text-emerald-100 hover:bg-white/10">
          4. Xử lý Tình huống Thực chiến
        </button>
        <button data-tab="quiz" class="nav-tab-btn px-3.5 py-2 rounded-lg text-xs sm:text-sm font-semibold whitespace-nowrap transition text-emerald-100 hover:bg-white/10">
          5. Thi Sát hạch & Chứng chỉ
        </button>
        <button data-tab="guide" class="nav-tab-btn px-3.5 py-2 rounded-lg text-xs sm:text-sm font-semibold whitespace-nowrap transition text-emerald-100 hover:bg-white/10">
          6. Hướng dẫn Xây dựng & Quản trị
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

    <!-- TAB 1: DASHBOARD -->
    <section id="tab-dashboard" class="tab-section space-y-6">
      <!-- Hero Banner -->
      <div class="relative rounded-2xl overflow-hidden shadow-lg border border-slate-200 bg-slate-900 p-6 text-white">
        <h2 class="text-xl font-bold mb-2">Chào mừng bạn đến với Cổng Đào Tạo Nội Bộ Điện Máy Tây Đô</h2>
        <p class="text-sm text-slate-300">Hệ thống ghi nhớ tự động tiến độ học tập dựa trên tên nhân viên của bạn trên thiết bị này.</p>
      </div>
    </section>

  </main>

  <!-- Script xử lý lưu tên và lịch sử tiến độ học tập -->
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const profileBtn = document.getElementById("openProfileModalBtn");
      const staffNameSpan = document.getElementById("headerStaffName");
      const progressBadge = document.getElementById("headerProgressBadge");

      // Lấy tên đã lưu trước đó trong trình duyệt
      let currentStaff = localStorage.getItem("taydo_staff_name");

      if (!currentStaff) {
        currentStaff = prompt("Vui lòng nhập Họ và Tên nhân viên của bạn (Hệ thống sẽ lưu lại để không phải học lại từ đầu):", "Nguyễn Văn Minh");
        if (currentStaff && currentStaff.trim() !== "") {
          localStorage.setItem("taydo_staff_name", currentStaff.trim());
          localStorage.setItem("progress_" + currentStaff.trim(), "0%");
        } else {
          currentStaff = "Nhân viên Tây Đô";
        }
      }

      // Tải tiến độ tương ứng với tên nhân viên này
      let savedProgress = localStorage.getItem("progress_" + currentStaff) || "0%";

      // Hiển thị lên giao diện
      staffNameSpan.innerText = "NV: " + currentStaff;
      progressBadge.innerText = savedProgress;

      // Tính năng bấm vào tên để đổi/chọn lại tên nhân viên khác
      profileBtn.addEventListener("click", function() {
        let enteredName = prompt("Nhập tên nhân viên của bạn (Chọn đúng tên cũ để xem lại tiến độ):", localStorage.getItem("taydo_staff_name") || "");
        if (enteredName && enteredName.trim() !== "") {
          let cleanName = enteredName.trim();
          localStorage.setItem("taydo_staff_name", cleanName);
          staffNameSpan.innerText = "NV: " + cleanName;
          
          let userProgress = localStorage.getItem("progress_" + cleanName) || "0%";
          progressBadge.innerText = userProgress;
        }
      });
    });
  </script>
</body>
</html>
